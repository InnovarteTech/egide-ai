name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, redis, pcntl, zip
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, redis, pcntl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --no-audit --no-fund && npm run build
      - run: npx playwright install --with-deps chromium
        env:
          CI: '1'
      - run: |
          cp .env.example .env
          php artisan key:generate
          EGIDE_ADMIN_EMAIL=admin@egide.test EGIDE_ADMIN_PASSWORD=egide-e2e-secret php artisan migrate --seed --force
          php artisan serve --port=8187 &
          npx wait-on http://127.0.0.1:8187/entrar -t 30000
      - run: npx playwright test
        env:
          E2E_BASE_URL: http://127.0.0.1:8187
          E2E_PASSWORD: egide-e2e-secret

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install mitmproxy hypothesis
      - run: python -m unittest discover -s tests/runner

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node landing/build.mjs && node landing/check.mjs
